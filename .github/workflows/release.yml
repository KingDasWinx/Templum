name: Release

# Tag `vX.Y.Z` (pushed by publish.sh) → installers and portable builds for every platform → a published GitHub
# Release with them, the one-line installers (install.sh, install.ps1) and a .sha256 beside each file. Its notes say how
# to install and what each file is (.github/release-notes.md), then the tag's CHANGELOG section. A `-rc.N` tag is a
# prerelease.
# Run it manually (workflow_dispatch) for a dry run: the builds are uploaded as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, formats: dmg }
          - { os: macos-latest, target: x86_64-apple-darwin, formats: dmg }
          # Oldest supported Ubuntu runners: older glibc means the binaries run on more distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage,pacman" }
          # No pacman here: its PKGBUILD has a fixed name, which the x86_64 one already takes.
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, formats: "deb,appimage" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: "nsis,wix" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag pushed by hand must name the version in Cargo.toml too, or the installers would carry another one.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      # GPUI's Linux build dependencies (keep in sync with CONTRIBUTING.md and ci.yml).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # No prebuilt cargo-packager binaries are published, so it is built from source.
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build -p templum --release --locked --target ${{ matrix.target }}
      - run: cargo packager -p templum --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir "${{ github.workspace }}/dist"
      # A bundle whose signature doesn't hold is "damaged" for whoever downloads it, with no way to open it.
      - if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/dmg/*.app
          hdiutil detach "$RUNNER_TEMP/dmg"
      # The bare executable, for people who want to download and run it: a .tar.gz on Linux, the .exe on Windows.
      - if: runner.os == 'Linux'
        run: |
          mkdir templum-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/templum LICENSE templum-${{ matrix.target }}/
          tar -czf dist/templum-${{ matrix.target }}.tar.gz templum-${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/templum.exe dist/templum-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: templum-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/PKGBUILD
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # releases/latest/download/install.sh is what the README and the notes tell people to run.
      - run: cp install.sh install.ps1 dist/
      - run: (cd dist && for file in *; do sha256sum "$file" > "$file.sha256"; done)
      # How to install, then the CHANGELOG section publish.sh wrote; a prerelease has none, so GitHub lists its commits.
      - run: |
          version=${GITHUB_REF_NAME#v}
          sed "s/{version}/$version/g" .github/release-notes.md > notes.md
          awk -v heading="## $version" '$0 == heading { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > changes.md
          flags=(--notes-file notes.md)
          [[ $version == *-* ]] && flags+=(--prerelease)
          if grep -q '[^[:space:]]' changes.md; then
            printf "\n## What's new\n" >> notes.md
            cat changes.md >> notes.md
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Templum $version" "${flags[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
