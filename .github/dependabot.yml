version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
        # GPUI snapshots break APIs: gpui-kit bumps get their own PR (docs/adr/0002-ui-framework.md).
        exclude-patterns: ["gpui-kit"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
