[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["KingDasWinx"]
repository = "https://github.com/KingDasWinx/Templum"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
strip = true

# `cargo run -p templum` is a usable app: the UI framework, text shaping, tessellation and the
# terminal core are compiled with optimizations even in dev builds. Templum's own crates stay
# at opt-level 0, so they keep fast rebuilds and full debug info.
[profile.dev.package."*"]
opt-level = 2
