# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Templum is MIT, so only permissive licenses are allowed. Anything not listed (GPL, AGPL, LGPL...) fails CI.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail everywhere; "unmaintained" only fails for our direct dependencies,
# since transitive ones (inside GPUI) are not ours to replace.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
