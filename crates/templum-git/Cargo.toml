[package]
name = "templum-git"
description = "Templum's Git client: the user's own `git`, run as a command, with typed results. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Already in the tree: the results go to the API as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
