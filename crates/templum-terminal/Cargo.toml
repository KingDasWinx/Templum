[package]
name = "templum-terminal"
description = "A shell in a PTY for Templum, on top of alacritty_terminal. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = "=0.26.0"
# Already in the tree (alacritty's): names the types of the PTY trait the shell-integration tap implements.
polling = "3"
# Already in the tree: reads a shell's current folder (for "new terminal in the same folder").
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree: the PTY's foreground process group (the shell the user types into).
rustix = { version = "1.1", default-features = false, features = ["std", "termios"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
