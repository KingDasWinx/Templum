[package]
name = "templum"
description = "An infinite canvas of terminals."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI (Zed's UI framework) + widgets, through one facade that pins the GPUI snapshot.
# Pinned exactly: upgrade only in a dedicated PR (see docs/adr/0002-ui-framework.md).
gpui-kit = "=0.7.1"
templum-canvas = { path = "../templum-canvas" }
templum-terminal = { path = "../templum-terminal" }
# Already in the tree through GPUI: its channel wakes the UI from PTY threads.
futures = "0.3"
# Already in the tree: reads theme files and edits config.toml without losing the user's comments.
toml_edit = "0.25"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

# Installers: see .github/workflows/release.yml
[package.metadata.packager]
product-name = "Templum"
identifier = "io.github.kingdaswinx.templum"
category = "DeveloperTool"
icons = ["icons/*.png"]
