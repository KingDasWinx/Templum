# Pinned exactly: upgrade only in a dedicated PR (see docs/adr/0002-ui-framework.md).
gpui-kit = "=0.7.1"

[lints]
workspace = true

# Installers: see .github/workflows/release.yml
[package.metadata.packager]
product-name = "Templum"
identifier = "io.github.kingdaswinx.templum"
category = "DeveloperTool"
icons = ["icons/*.png"]
